[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graph-ir"
version = "0.1.0"
description = "graph.yaml intermediate representation: schema, validator and graph transforms shared across the ZiNets ecosystem"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.2",
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gir = "graph_ir.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_ir"]

[tool.pytest.ini_options]
testpaths = ["tests"]
